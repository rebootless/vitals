name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    container:
      image: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 12 (Bookworm)",    image: "debian:12" }
          - { name: "Debian 13 (Trixie)",      image: "debian:13" }
          - { name: "Ubuntu 22.04 (Jammy)",    image: "ubuntu:22.04" }
          - { name: "Ubuntu 24.04 (Noble)",    image: "ubuntu:24.04" }
          - { name: "Ubuntu 26.04 (Resolute)", image: "ubuntu:26.04" }
          - { name: "Fedora 43",               image: "fedora:43" }
          - { name: "Fedora 44",               image: "fedora:44" }
          - { name: "AlmaLinux 8 (RHEL 8)",    image: "almalinux:8" }
          - { name: "AlmaLinux 9 (RHEL 9)",    image: "almalinux:9" }
          - { name: "AlmaLinux 10 (RHEL 10)",  image: "almalinux:10" }
          - { name: "openSUSE Tumbleweed",     image: "opensuse/tumbleweed:latest" }
          - { name: "openSUSE Leap 16.0",      image: "opensuse/leap:16.0" }
          - { name: "Arch Linux",              image: "archlinux:latest" }

    defaults:
      run:
        shell: bash

    steps:
    - name: Install git
      run: |
        set -eux
        # tar and gzip are needed by actions/cache
        if   command -v apt-get >/dev/null; then apt-get update -q && apt-get install -y --no-install-recommends ca-certificates git tar gzip
        elif command -v dnf     >/dev/null; then dnf install -y git tar gzip
        elif command -v zypper  >/dev/null; then zypper --non-interactive install --no-recommends git tar gzip
        elif command -v pacman  >/dev/null; then pacman -Syu --noconfirm --needed git tar gzip
        fi

    - name: Checkout repository
      uses: actions/checkout@v5

    # notcurses source and its build tree; the key rolls over weekly so
    # compiler and library updates in the images are picked up
    - name: Cache key
      id: cache_key
      run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

    - name: Cache notcurses build
      uses: actions/cache@v4
      with:
        path: |
          notcurses
          build
        key: nc-${{ matrix.image }}-${{ steps.cache_key.outputs.week }}-${{ hashFiles('setup.sh', 'deps.sh', 'CMakeLists.txt') }}

    - name: Set up (deps + notcurses)
      env:
        VITALS_ALLOW_ROOT: "1"
      run: bash setup.sh

    - name: Build vitals
      env:
        VITALS_KEEP_BUILD: "1"
      run: bash build.sh

    - name: Verify binary
      run: |
        set -eux
        test -x build/vitals
        ldd build/vitals
        if ldd build/vitals | grep -q "not found"; then
          echo "::error::unresolved shared libraries"
          exit 1
        fi
        if ldd build/vitals | grep -q notcurses; then
          echo "::error::notcurses must be linked statically"
          exit 1
        fi

    - name: Self-test
      run: timeout 60 build/vitals --self-test

    - name: Install layout
      run: |
        set -eux
        cmake --install build
        test -x /usr/local/bin/vitals
        test -d /usr/local/share/vitals/themes
        /usr/local/bin/vitals --version
        # only the binary and themes: notcurses is linked statically
        if compgen -G "/usr/local/lib*/libnotcurses*" >/dev/null || [ -e /usr/local/include/notcurses ]; then
          echo "::error::notcurses files were installed"
          exit 1
        fi

  install-script:
    name: install.sh and uninstall.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install from this checkout
      env:
        VITALS_REPO_URL: file://${{ github.workspace }}
      run: bash install.sh

    - name: Verify install
      run: |
        set -eux
        test -x /usr/local/bin/vitals
        test -d /usr/local/share/vitals/themes
        vitals --version
        timeout 60 vitals --self-test

    - name: Uninstall
      run: |
        set -eux
        mkdir -p "$HOME/.config/vitals"
        touch "$HOME/.config/vitals/config"
        printf 'y\ny\n' | bash uninstall.sh
        test ! -e /usr/local/bin/vitals
        test ! -e /usr/local/share/vitals
        test ! -e "$HOME/.config/vitals"
        bash uninstall.sh | grep -q "does not appear to be installed"
