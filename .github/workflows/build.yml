name: Build

# Trigger CI on pushes to supported branches and pull requests
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    container:
      image: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 12 (Bookworm)",    image: "debian:12" }
          - { name: "Debian 13 (Trixie)",      image: "debian:13" }
          - { name: "Ubuntu 22.04 (Jammy)",    image: "ubuntu:22.04" }
          - { name: "Ubuntu 24.04 (Noble)",    image: "ubuntu:24.04" }
          - { name: "Ubuntu 26.04 (Resolute)", image: "ubuntu:26.04" }
          - { name: "Fedora 43",               image: "fedora:43" }
          - { name: "Fedora 44",               image: "fedora:44" }
          - { name: "AlmaLinux 8 (RHEL 8)",    image: "almalinux:8" }
          - { name: "AlmaLinux 9 (RHEL 9)",    image: "almalinux:9" }
          - { name: "AlmaLinux 10 (RHEL 10)",  image: "almalinux:10" }
          - { name: "openSUSE Tumbleweed",     image: "opensuse/tumbleweed:latest" }
          - { name: "openSUSE Leap 16.0",      image: "opensuse/leap:16.0" }
          - { name: "Arch Linux",              image: "archlinux:latest" }

    defaults:
      run:
        shell: bash

    steps:
    - name: Install git
      run: |
        set -eux
        if   command -v apt-get >/dev/null; then apt-get update -q && apt-get install -y --no-install-recommends ca-certificates git
        elif command -v dnf     >/dev/null; then dnf install -y git
        elif command -v zypper  >/dev/null; then zypper --non-interactive install --no-recommends git
        elif command -v pacman  >/dev/null; then pacman -Syu --noconfirm --needed git
        fi

    # Checkout the current revision for CI scripts and verification
    - name: Checkout repository
      uses: actions/checkout@v5

    # Install vitals using the public installation procedure
    # install.sh independently clones the repository
    - name: Install
      env:
        VITALS_ALLOW_ROOT: "1"
      run: bash install.sh

    - name: Verify install
      run: |
        set -eux
        test -x /usr/local/bin/vitals
        test -d /usr/local/share/vitals/themes
        ldd /usr/local/bin/vitals
        if ldd /usr/local/bin/vitals | grep -q "not found"; then
          echo "::error::unresolved shared libraries"
          exit 1
        fi
        if ldd /usr/local/bin/vitals | grep -q notcurses; then
          echo "::error::notcurses must be linked statically"
          exit 1
        fi
        # only the binary and themes are installed
        if compgen -G "/usr/local/lib*/libnotcurses*" >/dev/null || [ -e /usr/local/include/notcurses ]; then
          echo "::error::notcurses files were installed"
          exit 1
        fi
        vitals --version
        timeout 60 vitals --self-test

    - name: Uninstall
      env:
        VITALS_ALLOW_ROOT: "1"
      run: |
        set -eux
        mkdir -p "$HOME/.config/vitals"
        touch "$HOME/.config/vitals/config.conf"
        printf 'y\ny\n' | bash uninstall.sh
        test ! -e /usr/local/bin/vitals
        test ! -e /usr/local/share/vitals
        test ! -e "$HOME/.config/vitals"
        bash uninstall.sh | grep -q "does not appear to be installed"
